    <!--
      THESIS: CFLB reads as a matchday programme, not a SaaS dashboard —
      an asymmetric splash-plus-sidebar grid replaces the stacked
      hero-metric-card pattern every prior pass reused under new paint.
      OWN-WORLD: near-black ink ground, flat pitch-green as the single
      spot-ink accent (no gradients, no glass, no blur), gold for
      points/prestige, red for relegation only. Anton carries splash
      headlines and big numerals; Archivo Narrow carries nav, data, and
      body copy. Zero border-radius anywhere — print has no rounded
      corners. Tables and fixture lists are hairline-ruled, sitting
      directly on the page, never boxed in a bordered card.
      STORY: a fan opens the app and reads it like this week's matchday
      programme — cover splash story, personal rank and games-coming-up
      in the margin, table and predictions as dense classified-style
      grids below.
      FIRST VIEWPORT: masthead + underline nav, then a two-column cover
      (splash story left, rank + fixtures sidebar right), duotone photo
      treatment tinted with the flag-green accent.
      FORM: user-pinned direction after four rejected passes (flat neon
      dashboard, bolder type only, teletext x2); this is the accepted
      fanzine/matchday-programme comp, rebuilt from the approved artifact.
      FINISH: unreviewed and undocumented is unfinished; this build ends
      with the finish review, the verdict, and DESIGN.md
    -->

    <script type="module" src="/src/main.jsx"></script>
